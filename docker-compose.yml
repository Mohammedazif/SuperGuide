services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: superguide
    ports:
      - "55432:5432"
    volumes:
      - superguide-pgdata:/var/lib/postgresql/data
      - ./tools/scripts/bootstrap-roles.sql:/docker-entrypoint-initdb.d/00-bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d superguide"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  superguide-pgdata:
