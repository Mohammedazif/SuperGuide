host: 127.0.0.1
version: 1
routes:
  - id: dashboard
    template: /
    params: []
  - id: billing.address
    template: /settings/billing
    params: []
  - id: team.members
    template: /settings/team
    params: []
  - id: profile.settings
    template: /settings/profile
    params: []
  - id: plan.overview
    template: /settings/plan
    params: []
capabilities:
  - id: seat.invite
    description: Invite a teammate by email address
    risk: write
    route: /settings/team
    params:
      - name: email
        description: Email address of the person to invite
    steps:
      - action: navigate
        route: /settings/team
      - action: type
        target: { role: textbox, name: "Email" }
        value: { from: param, name: email }
      - action: click
        target: { role: button, name: "Invite member" }
    expect:
      - kind: element-present
        target: { role: status, name: "Invitation sent" }
  - id: billing.update-address
    description: Update the billing address
    risk: write
    route: /settings/billing
    params:
      - name: line1
        description: First line of the street address
      - name: city
        description: City
      - name: postal
        description: Postal code
    steps:
      - action: navigate
        route: /settings/billing
      - action: type
        target: { role: textbox, name: "Address line 1" }
        value: { from: param, name: line1 }
      - action: type
        target: { role: textbox, name: "City" }
        value: { from: param, name: city }
      - action: type
        target: { role: textbox, name: "Postal code" }
        value: { from: param, name: postal }
      - action: click
        target: { role: button, name: "Save address" }
    expect:
      - kind: element-present
        target: { role: status, name: "Address saved" }
