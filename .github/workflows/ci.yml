name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  SG_DATABASE_URL: postgres://sg_app:sg_app_dev@127.0.0.1:55432/superguide
  SG_MIGRATION_DATABASE_URL: postgres://sg_migrator:sg_migrator_dev@127.0.0.1:55432/superguide
  SG_PUBLIC_ORIGIN: http://127.0.0.1:8080

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate run-scoped keys
        run: |
          {
            echo "SG_SESSION_SIGNING_KEY=$(openssl rand -base64 32)"
            echo "SG_SECRET_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SG_WEBHOOK_SIGNING_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:unit:coverage
      - run: pnpm check:forbidden
      - run: pnpm check:bundle-boundary

  verified:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superguide
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d superguide"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate run-scoped keys
        run: |
          {
            echo "SG_SESSION_SIGNING_KEY=$(openssl rand -base64 32)"
            echo "SG_SECRET_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SG_WEBHOOK_SIGNING_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: create the two database roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d superguide \
            -v ON_ERROR_STOP=1 -f tools/scripts/bootstrap-roles.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d superguide \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:security

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # The gate: a drop below the threshold on either interface variant blocks the merge.
      - run: pnpm eval --variant=a --check-determinism
      - run: pnpm eval --variant=b

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
