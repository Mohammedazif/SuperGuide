packages:
  - "packages/*"
  - "apps/*"
  - "eval/harness"
  - "tools/eslint-plugin-superguide"

# esbuild ships a platform-specific binary that its install script links into place, and
# vitest and tsx both need it. Approving the build deliberately is what keeps a clean
# `pnpm install --frozen-lockfile` from failing on ERR_PNPM_IGNORED_BUILDS.
# @google/genai and protobufjs postinstall scripts are codegen/telemetry helpers the
# SDKs run fine without; declining them keeps the install surface minimal.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
