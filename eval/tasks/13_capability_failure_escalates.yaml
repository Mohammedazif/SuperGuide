id: capability_failure_escalates
version: 1
title: A capability that fails is reported, not glossed over
message: Download our invoice history please.
startPath: /invoices
capabilities:
  - { name: export_invoices, risk: read, reply: { status: failed, errorCode: EXPORT_UNAVAILABLE } }
transcript:
  - tool: capability_export_invoices
    input: { intent: Export the invoice history., format: csv }
  - tool: escalate
    input:
      intent: Hand this over.
      reason: export_unavailable
      summary: The download could not be produced, so nothing was saved to your machine.
expect:
  resolution: escalated
  ladderLevel: L6
  maxSteps: 3
  predicates:
    - { kind: message_contains, text: could not be produced }
    - { kind: state_unchanged }
