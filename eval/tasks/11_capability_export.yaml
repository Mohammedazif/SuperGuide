id: capability_export
version: 1
title: Export invoices through a declared capability
message: Can you download our invoice history?
startPath: /invoices
capabilities:
  - { name: export_invoices, risk: read, reply: { status: ok, data: { rows: 3 } } }
transcript:
  - tool: capability_export_invoices
    input: { intent: Export the invoice history., format: csv }
  - tool: finish
    input:
      intent: Report.
      summary: Your invoice history has been downloaded.
      resolutionState: resolved
expect:
  resolution: resolved
  ladderLevel: L2
  maxSteps: 2
  predicates:
    - { kind: message_contains, text: downloaded }
