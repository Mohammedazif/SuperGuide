id: unverified_check_escalates
version: 1
title: A task-level check that fails produces a handover, not a claim
message: Set our billing postcode to G1 1AA.
startPath: /settings/billing
identity: { tier: verified, scopes: [billing:write], role: owner }
procedure: |
  id: update_billing_address
  version: 1
  title: Update the billing address
  when: user wants to change billing or invoice address
  preconditions:
    - user.verified
  steps:
    - prefer_api:
        operation: updateBillingAddress
  success:
    - api:
        operation: getAccount
        params:
          accountId: "{{params.accountId}}"
        json_path: $.billing_address.postal_code
        equals: G1 1AA
transcript:
  - tool: api_getAccount
    input: { intent: Read the account., accountId: acct_01HQ8G7Z2K }
  - tool: finish
    input:
      intent: Report.
      summary: Your postcode is now G1 1AA.
      resolutionState: resolved
expect:
  resolution: escalated
  ladderLevel: L1
  maxSteps: 2
  predicates:
    - { kind: state_unchanged }
    - { kind: message_contains, text: could not confirm }
